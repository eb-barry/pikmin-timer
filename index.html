<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16382c">
  <meta name="color-scheme" content="light">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="蘑菇計時">
  <title>皮克敏蘑菇計時</title>
  <meta name="description" content="用皮克敏蘑菇截圖設定重生倒數">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="zh_TW">
  <meta property="og:site_name" content="皮克敏蘑菇計時">
  <meta property="og:title" content="皮克敏蘑菇計時">
  <meta property="og:description" content="用皮克敏蘑菇截圖設定重生倒數">
  <meta property="og:url" content="https://eb-barry.github.io/pikmin-timer/">
  <meta property="og:image" content="https://eb-barry.github.io/pikmin-timer/assets/icons/share-card.png">
  <meta property="og:image:secure_url" content="https://eb-barry.github.io/pikmin-timer/assets/icons/share-card.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="皮克敏蘑菇計時">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="皮克敏蘑菇計時">
  <meta name="twitter:description" content="用皮克敏蘑菇截圖設定重生倒數">
  <meta name="twitter:image" content="https://eb-barry.github.io/pikmin-timer/assets/icons/share-card.png">
  <link rel="icon" href="./assets/icons/app-icon.png">
  <link rel="apple-touch-icon" href="./assets/icons/app-icon-512.png">
  <link rel="image_src" href="https://eb-barry.github.io/pikmin-timer/assets/icons/app-icon-512.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./css/app.css">
</head>
<body>
  <div id="app" class="app">
    <h1 class="sr-only">皮克敏蘑菇計時</h1>
    <header class="topbar">
      <button id="muteBtn" class="mute-btn" type="button" hidden aria-label="停止播放">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3.2 9.6h3.2L11 6.1v11.8l-4.6-3.5H3.2z" fill="#243028"/>
          <circle cx="16.6" cy="12" r="5" fill="none" stroke="#e10600" stroke-width="1.8"/>
          <path d="M13.8 9.2l5.6 5.6" fill="none" stroke="#e10600" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </button>
      <div class="top-actions">
        <button id="uploadBtn" class="icon-btn" type="button" aria-label="上傳截圖">
          <img src="./assets/icons/open-photo.png" alt="" draggable="false">
        </button>
        <div class="settings-slot">
          <button id="settingsBtn" class="icon-btn" type="button" aria-label="設定">
            <img src="./assets/icons/settings.png" alt="" draggable="false">
          </button>
          <span id="appVersion" class="app-version"></span>
        </div>
      </div>
    </header>
    <p id="reading" class="reading" hidden></p>
    <main id="board" class="board"></main>
  </div>
  <input id="fileInput" type="file" accept="image/*" multiple hidden>
  <div id="sheet" class="sheet" hidden>
    <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div>
  </div>
  <button id="workCover" class="work-cover" type="button" hidden aria-label="回到計時">
    <img src="./assets/work-cover.jpg" alt="" draggable="false">
  </button>
  <button id="dimCover" class="dim-cover" type="button" hidden>
    <span id="dimDigits" class="dim-digits" lang="en"></span>
  </button>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
