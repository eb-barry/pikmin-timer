<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16382c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="蘑菇計時">
  <title>皮克敏蘑菇計時</title>
  <link rel="icon" href="./assets/icons/app-icon.png">
  <link rel="apple-touch-icon" href="./assets/icons/app-icon-512.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./css/app.css">
</head>
<body>
  <div id="app" class="app">
    <h1 class="sr-only">皮克敏蘑菇計時</h1>
    <header class="topbar">
      <button id="muteBtn" class="mute-btn" type="button" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10h3.2L12 6v12l-4.8-4H4z" fill="currentColor"/><path d="M16 9.2l4.6 5.6M20.6 9.2L16 14.8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>靜音</span>
        <span data-part="name"></span>
        <span class="mute-more" data-part="more" hidden></span>
      </button>
      <div class="top-actions">
        <button id="uploadBtn" class="icon-btn" type="button" aria-label="上傳截圖">
          <img src="./assets/icons/open-photo.png" alt="" draggable="false">
        </button>
        <button id="settingsBtn" class="icon-btn" type="button" aria-label="設定">
          <img src="./assets/icons/settings.png" alt="" draggable="false">
        </button>
      </div>
    </header>
    <p id="reading" class="reading" hidden>正在讀取截圖…</p>
    <main id="board" class="board"></main>
  </div>
  <input id="fileInput" type="file" accept="image/*" multiple hidden>
  <div id="sheet" class="sheet" hidden>
    <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div>
  </div>
  <button id="workCover" class="work-cover" type="button" hidden aria-label="回到計時">
    <img src="./assets/work-cover.jpg" alt="" draggable="false">
  </button>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
